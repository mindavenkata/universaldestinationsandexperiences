<!--/*
 * Universal Destinations & Experiences - Universal Footer Component
 */-->
<sly data-sly-use.model="com.universaldestinationsandexperiences.core.models.UniversalFooterModel"
     data-sly-use.templates="core/wcm/components/commons/v1/templates.html"
     data-sly-use.clientlib="/libs/granite/sightly/templates/clientlib.html"/>

<sly data-sly-call="${clientlib.css @ categories='universaldestinationsandexperiences.components.footer'}"/>
<sly data-sly-call="${clientlib.js @ categories='universaldestinationsandexperiences.components.footer'}"/>

<sly data-sly-test="${model.hasContent}">
    <footer class="cmp-universal-footer" data-cmp-is="universalFooter">
        <div class="cmp-universal-footer__container">
            
            <!-- Horizontal Divider Line -->
            <div class="cmp-universal-footer__divider"></div>

            <!-- Top Row: Social Links (Aligned Right) -->
            <div class="cmp-universal-footer__social-row" data-sly-test="${model.socialLinks}">
                <div class="cmp-universal-footer__social-list">
                    <sly data-sly-list.item="${model.socialLinks}">
                        <a href="${item.linkUrl}" 
                           class="cmp-universal-footer__social-link cmp-universal-footer__social-link--${item.platform}"
                           target="${item.target}"
                           rel="${item.openInNewTab ? 'noopener noreferrer' : ''}">
                            <span class="cmp-universal-footer__social-label">${item.label}</span>
                            <span class="cmp-universal-footer__social-icon-box cmp-universal-footer__social-icon-box--${item.platform}">
                                <!-- YouTube Icon -->
                                <svg data-sly-test="${item.youtube}" class="cmp-universal-footer__icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                                    <path d="M10 15l5.19-3L10 9v6m11.56-7.83c.13.47.22 1.1.28 1.9.07.8.1 1.49.1 2.09L22 12c0 2.19-.16 3.8-.44 4.83-.25.9-.83 1.48-1.73 1.73-.47.13-1.33.22-2.65.28-1.3.07-2.49.1-3.59.1L12 20c-4.19 0-6.8-.16-7.83-.44-.9-.25-1.48-.83-1.73-1.73-.13-.47-.22-1.1-.28-1.9-.07-.8-.1-1.49-.1-2.09L2 12c0-2.19.16-3.8.44-4.83.25-.9.83-1.48 1.73-1.73.47-.13 1.33-.22 2.65-.28 1.3-.07 2.49-.1 3.59-.1L12 4c4.19 0 6.8.16 7.83.44.9.25 1.48.83 1.73 1.73z"/>
                                </svg>
                                <!-- LinkedIn Icon -->
                                <svg data-sly-test="${item.linkedin}" class="cmp-universal-footer__icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                                    <path d="M19 3a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h14m-.5 15.5v-5.3a3.26 3.26 0 0 0-3.26-3.26c-.85 0-1.84.52-2.28 1.3v-1.11h-2.79v8.37h2.79v-4.93c0-.77.62-1.4 1.39-1.4a1.4 1.4 0 0 1 1.4 1.4v4.93h2.75M6.88 8.56a1.68 1.68 0 0 0 1.68-1.68c0-.93-.75-1.69-1.68-1.69a1.69 1.69 0 0 0-1.69 1.69c0 .93.76 1.68 1.69 1.68m1.39 9.94v-8.37H5.5v8.37h2.77z"/>
                                </svg>
                                <!-- Fallback / Generic Icon -->
                                <svg data-sly-test="${!item.youtube && !item.linkedin}" class="cmp-universal-footer__icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                                    <circle cx="12" cy="12" r="10"/>
                                </svg>
                            </span>
                        </a>
                    </sly>
                </div>
            </div>

            <!-- Bottom Row: Copyright + Pipe-separated Bold Blue Legal Links + Back to top -->
            <div class="cmp-universal-footer__bottom-row">
                <!-- Left: Copyright Notice -->
                <div class="cmp-universal-footer__copyright">
                    <p class="cmp-universal-footer__copyright-text">${model.copyrightText}</p>
                </div>

                <!-- Center/Right: Legal Policy Links -->
                <nav class="cmp-universal-footer__legal-nav" aria-label="${'Legal and Policy Navigation' @ i18n}">
                    <ul class="cmp-universal-footer__legal-list" data-sly-list.legal="${model.legalLinks}">
                        <li class="cmp-universal-footer__legal-item">
                            <a href="${legal.formattedUrl}" 
                               class="cmp-universal-footer__legal-link"
                               target="${legal.target}"
                               rel="${legal.openInNewTab ? 'noopener noreferrer' : ''}">
                                ${legal.linkText}
                            </a>
                            <span class="cmp-universal-footer__separator" data-sly-test="${!legalList.last}">|</span>
                        </li>
                    </ul>
                </nav>

                <!-- Scroll to Top Button (Anchored on right) -->
                <div class="cmp-universal-footer__back-to-top-wrap" data-sly-test="${model.showBackToTop}">
                    <button type="button" 
                            class="cmp-universal-footer__back-to-top" 
                            data-cmp-hook-footer="backToTop"
                            aria-label="${'Scroll to top' @ i18n}">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <polyline points="18 15 12 9 6 15"></polyline>
                        </svg>
                    </button>
                </div>
            </div>

        </div>
    </footer>
</sly>

<!-- Author Placeholder in Edit Mode -->
<sly data-sly-call="${templates.placeholder @ isEmpty=!model.hasContent, classAppend='cmp-universal-footer'}"></sly>
